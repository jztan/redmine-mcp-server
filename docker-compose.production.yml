services:
  redmine-mcp-server:
    image: "${REDMINE_MCP_IMAGE:?Set REDMINE_MCP_IMAGE to an immutable image digest}"
    labels:
      vilnius.logging.enabled: "true"
      vilnius.logging.app: redmine-mcp-server
      vilnius.logging.component: mcp
    pull_policy: always
    container_name: redmine-mcp-server
    init: true
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      ATTACHMENTS_DIR: /app/attachments
      REDMINE_INTROSPECT_CLIENT_SECRET: ""
      REDMINE_INTROSPECT_CLIENT_SECRET_FILE: /run/secrets/redmine_introspect_client_secret
    secrets:
      - redmine_introspect_client_secret
    volumes:
      - redmine_mcp_production_logs:/app/logs
      - redmine_mcp_production_data:/app/data
      - redmine_mcp_production_attachments:/app/attachments
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    networks:
      - redmine-mcp-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

networks:
  redmine-mcp-network:
    driver: bridge

volumes:
  redmine_mcp_production_logs:
    name: redmine-mcp-production-logs
  redmine_mcp_production_data:
    name: redmine-mcp-production-data
  redmine_mcp_production_attachments:
    name: redmine-mcp-production-attachments

secrets:
  redmine_introspect_client_secret:
    file: "${REDMINE_INTROSPECT_SECRET_PATH:-/home/ubuntu/secrets/redmine-mcp-server/redmine_introspect_client_secret}"
