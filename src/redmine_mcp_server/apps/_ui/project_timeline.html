<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Timeline</title>
    <style>
      :root {
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
          Arial, sans-serif;
        --surface: transparent;
        --shell: rgba(255, 255, 255, 0.68);
        --panel: rgba(234, 240, 248, 0.88);
        --panel-2: rgba(223, 231, 243, 0.96);
        --lane: rgba(255, 255, 255, 0.4);
        --card: #ffffff;
        --border: rgba(194, 205, 220, 0.78);
        --border-strong: rgba(175, 188, 208, 0.9);
        --text: #162033;
        --text-2: #5f6b7c;
        --text-3: #8d98aa;
        --accent: #2563eb;
        --accent-soft: rgba(219, 231, 255, 0.9);
        --button-bg: rgba(248, 251, 255, 0.92);
        --button-border: rgba(207, 217, 236, 0.95);
        --shadow: 0 8px 24px rgba(31, 41, 55, 0.06);
        --card-shadow: 0 3px 10px rgba(37, 99, 235, 0.05);
        --wash: rgba(255, 255, 255, 0.16);
        --pos: #12b76a;
        --neg: #e5484d;
        --bar-track: rgba(148, 163, 184, 0.28);
        --prio-urgent: #e5484d;
        --prio-high: #f59e0b;
        --prio-normal: #2563eb;
        --prio-low: #94a3b8;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --today: #e5653a;
        --on-accent: #ffffff;
        --stripe-a: rgba(148, 163, 184, 0.5);
        --stripe-b: rgba(148, 163, 184, 0.24);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --shell: rgba(20, 24, 30, 0.55);
          --panel: rgba(31, 36, 44, 0.96);
          --panel-2: rgba(45, 51, 61, 0.98);
          --lane: rgba(22, 27, 34, 0.9);
          --card: #2b313b;
          --border: rgba(96, 109, 129, 0.38);
          --border-strong: rgba(120, 135, 159, 0.56);
          --text: #f3f6fb;
          --text-2: #b9c3d4;
          --text-3: #8d99ad;
          --accent: #73a7ff;
          --accent-soft: rgba(61, 95, 160, 0.42);
          --button-bg: rgba(44, 51, 63, 0.96);
          --button-border: rgba(97, 113, 138, 0.62);
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.24);
          --card-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
          --wash: rgba(255, 255, 255, 0.035);
          --pos: #3fbf7f;
          --neg: #ff6b6b;
          --bar-track: rgba(148, 163, 184, 0.22);
          --prio-normal: #73a7ff;
          --prio-low: #7c899c;
          --today: #ff8a5c;
          --on-accent: #0b1a33;
          --stripe-a: rgba(148, 163, 184, 0.3);
          --stripe-b: rgba(148, 163, 184, 0.12);
        }
      }
      :root[data-theme="light"] {
        --shell: rgba(255, 255, 255, 0.68);
        --panel: rgba(234, 240, 248, 0.88);
        --panel-2: rgba(223, 231, 243, 0.96);
        --card: #ffffff;
        --border: rgba(194, 205, 220, 0.78);
        --border-strong: rgba(175, 188, 208, 0.9);
        --text: #162033;
        --text-2: #5f6b7c;
        --text-3: #8d98aa;
        --accent: #2563eb;
        --accent-soft: rgba(219, 231, 255, 0.9);
        --button-bg: rgba(248, 251, 255, 0.92);
        --button-border: rgba(207, 217, 236, 0.95);
        --wash: rgba(255, 255, 255, 0.16);
        --pos: #12b76a;
        --neg: #e5484d;
        --prio-normal: #2563eb;
        --prio-low: #94a3b8;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --today: #e5653a;
        --on-accent: #ffffff;
        --stripe-a: rgba(148, 163, 184, 0.5);
        --stripe-b: rgba(148, 163, 184, 0.24);
      }
      :root[data-theme="dark"] {
        --shell: rgba(20, 24, 30, 0.55);
        --panel: rgba(31, 36, 44, 0.96);
        --panel-2: rgba(45, 51, 61, 0.98);
        --card: #2b313b;
        --border: rgba(96, 109, 129, 0.38);
        --border-strong: rgba(120, 135, 159, 0.56);
        --text: #f3f6fb;
        --text-2: #b9c3d4;
        --text-3: #8d99ad;
        --accent: #73a7ff;
        --accent-soft: rgba(61, 95, 160, 0.42);
        --button-bg: rgba(44, 51, 63, 0.96);
        --button-border: rgba(97, 113, 138, 0.62);
        --wash: rgba(255, 255, 255, 0.035);
        --pos: #3fbf7f;
        --neg: #ff6b6b;
        --prio-normal: #73a7ff;
        --prio-low: #7c899c;
        --today: #ff8a5c;
        --on-accent: #0b1a33;
        --stripe-a: rgba(148, 163, 184, 0.3);
        --stripe-b: rgba(148, 163, 184, 0.12);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
      }
      body {
        background: var(--surface);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.4;
        -webkit-font-smoothing: antialiased;
        padding: 10px 0 0;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }

      .shell {
        background: var(--shell);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
      }
      .head-copy {
        min-width: 0;
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .head h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .head .sub {
        font-size: 12.5px;
        color: var(--text-2);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .head-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        flex-wrap: wrap;
      }
      .head .stamp {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-2);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 7px 12px;
        font-variant-numeric: tabular-nums;
      }
      .btn {
        font: inherit;
        font-size: 12px;
        font-weight: 650;
        color: var(--accent);
        background: var(--button-bg);
        border: 1px solid var(--button-border);
        border-radius: 999px;
        padding: 7px 13px;
        cursor: pointer;
        transition: background 0.12s ease, border-color 0.12s ease,
          transform 0.12s ease;
      }
      .btn:hover:not([disabled]) {
        background: var(--accent-soft);
        border-color: var(--accent);
        transform: translateY(-1px);
      }
      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .btn[disabled] {
        opacity: 0.45;
        cursor: default;
      }
      .ro-pill {
        font-size: 10.5px;
        font-weight: 700;
        color: var(--text-2);
        background: var(--accent-soft);
        border: 1px solid var(--button-border);
        border-radius: 999px;
        padding: 5px 9px;
      }
      .ro-pill[hidden] {
        display: none;
      }

      .body {
        padding: 0;
      }
      .body > .notice,
      .body > .tl-detail {
        margin: 12px 16px 0;
      }
      .body > #root > .panel {
        margin: 16px;
      }
      .notice {
        margin: 0 0 14px;
        font-size: 11.5px;
        color: var(--text-2);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px 12px;
      }
      .notice[hidden] {
        display: none;
      }
      .panel {
        margin: 8px 0;
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px 18px;
        text-align: center;
        color: var(--text-2);
        font-size: 12.5px;
        background: var(--wash);
      }
      .panel.error {
        border-color: #e5484d33;
        background: #e5484d0d;
        color: #c0393e;
      }
      @media (prefers-color-scheme: dark) {
        .panel.error {
          color: #ffb2b0;
        }
      }
      :root[data-theme="dark"] .panel.error {
        color: #ffb2b0;
      }

      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 24px 20px;
        border-top: 1px solid var(--border);
        background: var(--wash);
        color: var(--text-2);
        font-size: 11.5px;
      }
      .foot-note {
        color: var(--text-3);
        text-align: right;
      }

      .stamp-name {
        font-family: var(--font-mono);
        color: var(--today);
      }
      .tl {
        --label-w: 165px;
        position: relative;
        overflow: hidden;
      }
      .tl-axis {
        display: grid;
        grid-template-columns: var(--label-w) 1fr;
        height: 48px;
        border-bottom: 1px solid var(--border);
      }
      .tl-months {
        position: relative;
        margin-right: 12px;
      }
      .tl-month {
        position: absolute;
        top: 0;
        bottom: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 9px;
        overflow: hidden;
        white-space: nowrap;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text-2);
      }
      .tl-overlay {
        position: absolute;
        top: 0;
        bottom: 0;
        left: var(--label-w);
        right: 12px;
        pointer-events: none;
      }
      .tl-divider {
        position: absolute;
        top: 20px;
        height: 28px;
        width: 1px;
        background: var(--border);
      }
      .tl-today {
        position: absolute;
        top: 18px;
        bottom: 6px;
        width: 1.5px;
        margin-left: -0.75px;
        background: var(--today);
      }
      .tl-today-label {
        position: absolute;
        top: 3px;
        transform: translateX(-50%);
        font-size: 10.5px;
        font-weight: 650;
        color: var(--today);
      }
      .tl-body {
        padding: 4px 12px 10px;
      }
      .tl-group {
        padding: 16px 6px 7px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tl-row {
        display: grid;
        grid-template-columns: calc(var(--label-w) - 12px) 1fr;
        align-items: center;
        height: 34px;
        border-radius: 6px;
      }
      .tl-row.band {
        background: var(--panel-2);
      }
      .tl-label {
        padding-left: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--text);
      }
      .tl-id {
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 650;
        color: var(--accent);
        margin-right: 6px;
      }
      .tl-track {
        position: relative;
        height: 100%;
      }
      .bar,
      .marker,
      .diamond {
        position: absolute;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      .bar {
        top: 8px;
        height: 18px;
        border-radius: 6px;
        padding: 0 8px;
        font: 650 11px/18px var(--font-sans);
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        color: #fff;
      }
      .bar-in_progress,
      .marker-in_progress {
        background: var(--accent);
      }
      .bar-in_progress {
        color: var(--on-accent);
      }
      .bar-done,
      .marker-done {
        background: var(--pos);
      }
      .bar-planned {
        color: var(--text-2);
        background: repeating-linear-gradient(
          45deg,
          var(--stripe-a) 0 6px,
          var(--stripe-b) 6px 12px
        );
      }
      .marker-planned {
        background: var(--text-3);
      }
      .bar.overdue,
      .marker.overdue {
        box-shadow: 0 0 0 1.5px var(--neg);
      }
      .bar.inferred {
        -webkit-mask-image: linear-gradient(
          to right,
          #000 calc(100% - 16px),
          rgba(0, 0, 0, 0.25)
        );
        mask-image: linear-gradient(
          to right,
          #000 calc(100% - 16px),
          rgba(0, 0, 0, 0.25)
        );
      }
      .bar.clip-start {
        clip-path: polygon(6px 0, 100% 0, 100% 100%, 6px 100%, 0 50%);
        padding-left: 12px;
      }
      .bar.clip-end {
        clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 50%, calc(100% - 6px) 100%, 0 100%);
      }
      .bar.clip-start.clip-end {
        clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 50%, calc(100% - 6px) 100%, 6px 100%, 0 50%);
      }
      .bar.nolabel {
        color: transparent;
      }
      .marker {
        top: 13px;
        width: 8px;
        height: 8px;
        margin-left: -4px;
        border-radius: 50%;
      }
      .diamond {
        top: 11px;
        width: 12px;
        height: 12px;
        margin-left: -6px;
        border-radius: 2px;
        transform: rotate(45deg);
        background: var(--text);
      }
      .diamond.closed {
        background: var(--pos);
      }
      .bar:focus-visible,
      .marker:focus-visible,
      .diamond:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .tl-detail {
        margin: 0 0 12px;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        color: var(--text-2);
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
      }
      .tl-detail[hidden] {
        display: none;
      }
      .tl-detail b {
        color: var(--text);
        font-weight: 650;
      }
      .foot-chip {
        font-family: var(--font-mono);
        font-size: 11px;
        padding: 1px 6px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel-2);
        color: var(--text-2);
      }

      @media (max-width: 720px) {
        body {
          padding-top: 8px;
        }
        .head,
        .body,
        .foot {
          padding-left: 16px;
          padding-right: 16px;
        }
        .head {
          flex-direction: column;
        }
        .foot {
          flex-direction: column;
          align-items: flex-start;
        }
        .foot-note {
          text-align: left;
        }
        .tl {
          --label-w: 120px;
        }
        .body {
          padding-left: 0;
          padding-right: 0;
        }
        .head {
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <section class="shell" aria-label="Project timeline">
      <header class="head">
        <div class="head-copy">
          <h1>Timeline</h1>
          <div class="sub">
            <span id="project-name">Loading project</span>
          </div>
        </div>
        <div class="head-actions">
          <span id="ro-pill" class="ro-pill" hidden>Read-only</span>
          <span id="stamp" class="stamp"
            >via <span class="stamp-name">redmine-mcp-server</span></span
          >
          <button id="refresh-btn" class="btn" disabled>Refresh</button>
        </div>
      </header>
      <div class="body">
        <div id="truncated" class="notice" hidden></div>
        <div id="detail" class="tl-detail" hidden></div>
        <div id="root">
          <div class="panel" id="loading">Loading timeline...</div>
        </div>
      </div>
      <div class="foot">
        <span id="foot-left">Read-only: click a bar or milestone for details.</span>
        <span class="foot-note"
          >Backed by <span class="foot-chip">list_redmine_issues</span> &amp;
          <span class="foot-chip">list_redmine_versions</span></span
        >
      </div>
    </section>

    <script>
      (function () {
        "use strict";

        var PARENT = window.parent;
        var PROTOCOL_VERSION = "2026-01-26";

        var nextId = 1;
        var pending = new Map();
        var state = {
          payload: null,
          projectId: null,
          filters: null,
          startDate: null,
          endDate: null,
          detailKey: null,
          ready: false,
        };

        var rootEl = document.getElementById("root");
        var nameEl = document.getElementById("project-name");
        var truncatedEl = document.getElementById("truncated");
        var refreshBtn = document.getElementById("refresh-btn");
        var roPill = document.getElementById("ro-pill");
        var detailEl = document.getElementById("detail");
        var footLeft = document.getElementById("foot-left");

        // --- transport (mirrors triage_board.html) -----------------------
        function post(msg) {
          PARENT.postMessage(msg, "*");
        }
        function request(method, params) {
          var id = nextId++;
          post({ jsonrpc: "2.0", id: id, method: method, params: params });
          return new Promise(function (resolve, reject) {
            var timer = setTimeout(function () {
              if (pending.has(id)) {
                pending.delete(id);
                reject(new Error(method + " timed out"));
              }
            }, 15000);
            pending.set(id, {
              resolve: function (v) {
                clearTimeout(timer);
                resolve(v);
              },
              reject: function (e) {
                clearTimeout(timer);
                reject(e);
              },
            });
          });
        }
        function notify(method, params) {
          post({ jsonrpc: "2.0", method: method, params: params || {} });
        }

        function onMessage(event) {
          if (event.source !== PARENT) return;
          var msg = event.data;
          if (!msg || msg.jsonrpc !== "2.0") return;
          if (
            msg.id !== undefined &&
            (msg.result !== undefined || msg.error !== undefined)
          ) {
            var waiter = pending.get(msg.id);
            if (!waiter) return;
            pending.delete(msg.id);
            if (msg.error) {
              waiter.reject(new Error(msg.error.message || "request failed"));
            } else {
              waiter.resolve(msg.result);
            }
            return;
          }
          if (msg.method === "ping") {
            if (msg.id !== undefined) {
              post({ jsonrpc: "2.0", id: msg.id, result: {} });
            }
            return;
          }
          if (msg.method === "ui/notifications/tool-input") {
            var args = (msg.params && msg.params.arguments) || {};
            if (args.project_id !== undefined && args.project_id !== null) {
              state.projectId = args.project_id;
              refreshBtn.disabled = false;
            }
            if (args.filters !== undefined) {
              state.filters = args.filters;
            }
            if (args.start_date !== undefined) state.startDate = args.start_date;
            if (args.end_date !== undefined) state.endDate = args.end_date;
            maybeInitialLoad();
            return;
          }
          if (msg.method === "ui/notifications/tool-result") {
            applyResult(msg.params);
            return;
          }
          if (msg.id !== undefined) {
            post({
              jsonrpc: "2.0",
              id: msg.id,
              error: { code: -32601, message: "Method not found" },
            });
          }
        }

        // --- auto-resize (mirrors triage_board.html) ---------------------
        var lastW = 0;
        var lastH = 0;
        function reportSize() {
          if (!state.ready) return;
          var html = document.documentElement;
          var prev = html.style.height;
          html.style.height = "max-content";
          var h = Math.ceil(html.getBoundingClientRect().height);
          html.style.height = prev;
          var w = Math.ceil(window.innerWidth);
          if (w === lastW && h === lastH) return;
          lastW = w;
          lastH = h;
          notify("ui/notifications/size-changed", { width: w, height: h });
        }
        var resizeQueued = false;
        function queueResize() {
          if (resizeQueued) return;
          resizeQueued = true;
          requestAnimationFrame(function () {
            resizeQueued = false;
            reportSize();
          });
        }

        // --- helpers -----------------------------------------------------
        function el(tag, cls, text) {
          var n = document.createElement(tag);
          if (cls) n.className = cls;
          if (text !== undefined) n.textContent = text;
          return n;
        }
        // --- timeline render ----------------------------------------------
        var DAY = 86400000;
        var MONTHS = ["January", "February", "March", "April", "May", "June",
          "July", "August", "September", "October", "November", "December"];
        var STATE_LABEL = {
          in_progress: "In progress",
          planned: "Planned",
          done: "Done",
        };
        var WRAP_RE =
          /^<insecure-content-([0-9a-f]+)>\n([\s\S]*)\n<\/insecure-content-\1>$/;

        function parseDay(s) {
          var p = String(s).split("-");
          return Date.UTC(+p[0], +p[1] - 1, +p[2]);
        }
        function fmtDay(s) {
          var d = new Date(parseDay(s));
          return MONTHS[d.getUTCMonth()].slice(0, 3) + " " + d.getUTCDate() +
            ", " + d.getUTCFullYear();
        }
        function unwrapFirstLine(desc) {
          if (!desc) return "";
          var m = WRAP_RE.exec(desc);
          var line = (m ? m[2] : desc).split("\n")[0].trim();
          return line.length > 32 ? line.slice(0, 31) + "\u2026" : line;
        }
        function makeScale(w) {
          var s = parseDay(w.start);
          var span = parseDay(w.end) + DAY - s;
          return {
            // Left edge of a day, as a percentage of the track.
            at: function (day) {
              return ((parseDay(day) - s) / span) * 100;
            },
            // Right edge of a day (end dates are inclusive).
            after: function (day) {
              return ((parseDay(day) + DAY - s) / span) * 100;
            },
            clamp: function (pct) {
              return Math.max(0, Math.min(100, pct));
            },
          };
        }
        function pctStyle(node, left, width) {
          node.style.left = left + "%";
          if (width !== undefined) node.style.width = width + "%";
        }

        function axis(w, sc, overlay) {
          var months = el("div", "tl-months");
          var cur = new Date(parseDay(w.start));
          var endMs = parseDay(w.end);
          while (cur.getTime() <= endMs) {
            var y = cur.getUTCFullYear();
            var m = cur.getUTCMonth();
            var next = new Date(Date.UTC(y, m + 1, 1));
            var left = sc.clamp(((cur.getTime() - parseDay(w.start)) /
              (endMs + DAY - parseDay(w.start))) * 100);
            var right = sc.clamp(((next.getTime() - parseDay(w.start)) /
              (endMs + DAY - parseDay(w.start))) * 100);
            var cell = el("div", "tl-month", MONTHS[m]);
            cell.setAttribute("data-short", MONTHS[m].slice(0, 3));
            cell.setAttribute("data-long", MONTHS[m]);
            pctStyle(cell, left, right - left);
            months.appendChild(cell);
            var div = el("div", "tl-divider");
            pctStyle(div, left);
            overlay.appendChild(div);
            cur = next;
          }
          var row = el("div", "tl-axis");
          row.appendChild(el("div"));
          row.appendChild(months);
          return row;
        }

        function todayLine(w, sc, overlay) {
          var t = parseDay(w.today);
          if (t < parseDay(w.start) || t > parseDay(w.end)) return;
          var mid = (sc.at(w.today) + sc.after(w.today)) / 2;
          var line = el("div", "tl-today");
          pctStyle(line, mid);
          var label = el("div", "tl-today-label", "Today");
          pctStyle(label, mid);
          overlay.appendChild(line);
          overlay.appendChild(label);
        }

        function showDetail(key, lines) {
          if (state.detailKey === key) {
            hideDetail();
            return;
          }
          state.detailKey = key;
          detailEl.replaceChildren();
          lines.forEach(function (pair) {
            var span = el("span");
            span.appendChild(el("b", null, pair[0] + ": "));
            span.appendChild(document.createTextNode(pair[1]));
            detailEl.appendChild(span);
          });
          detailEl.hidden = false;
          queueResize();
        }
        function hideDetail() {
          state.detailKey = null;
          detailEl.hidden = true;
          queueResize();
        }

        function endLabel(r) {
          if (r.end_source === "version") return fmtDay(r.end) + " (from version)";
          if (r.end_source === "closed_on") return fmtDay(r.end) + " (closed on)";
          if (r.end_source === "start") return "not set";
          return fmtDay(r.end);
        }

        function issueNode(r, sc) {
          var key = "issue:" + r.id;
          var lines = [
            ["#" + r.id, r.subject],
            ["Status", r.status || "unknown"],
            ["Assignee", r.assigned_to || "unassigned"],
            ["Start", r.end_source === "start" || r.kind === "bar" ? fmtDay(r.start) : "not set"],
            ["End", endLabel(r)],
            ["Done", (r.done_ratio || 0) + "%"],
          ];
          var node;
          if (r.kind === "marker") {
            node = el("button", "marker marker-" + r.state + (r.overdue ? " overdue" : ""));
            pctStyle(node, sc.clamp((sc.at(r.start) + sc.after(r.start)) / 2));
          } else {
            var cls = "bar bar-" + r.state;
            if (r.overdue) cls += " overdue";
            if (r.end_source === "version" || r.end_source === "closed_on") cls += " inferred";
            if (r.clipped_start) cls += " clip-start";
            if (r.clipped_end) cls += " clip-end";
            node = el("button", cls, STATE_LABEL[r.state] || "");
            var left = sc.clamp(sc.at(r.start));
            pctStyle(node, left, sc.clamp(sc.after(r.end)) - left);
          }
          node.type = "button";
          node.title = "#" + r.id + " " + r.subject;
          node.setAttribute("aria-label", "#" + r.id + " " + r.subject);
          node.addEventListener("click", function () {
            showDetail(key, lines);
          });
          return node;
        }

        function milestoneNode(m, sc) {
          if (!m.in_window) return null;
          var node = el("button", "diamond" + (m.closed ? " closed" : ""));
          node.type = "button";
          pctStyle(node, (sc.at(m.date) + sc.after(m.date)) / 2);
          node.title = m.label + " \u00b7 " + fmtDay(m.date);
          node.setAttribute("aria-label", m.label);
          node.addEventListener("click", function () {
            showDetail("ms:" + m.version_id, [
              ["Milestone", m.label],
              ["Date", fmtDay(m.date)],
              ["Status", m.closed ? "closed" : "open"],
            ]);
          });
          return node;
        }

        function rowEl(r, sc, index) {
          var row = el("div", "tl-row" + (index % 2 === 0 ? " band" : ""));
          var label = el("div", "tl-label");
          var track = el("div", "tl-track");
          if (r.type === "milestone") {
            label.textContent = r.label;
            var d = milestoneNode(r, sc);
            if (d) track.appendChild(d);
          } else {
            label.appendChild(el("span", "tl-id", "#" + r.id));
            label.appendChild(document.createTextNode(r.subject || ""));
            label.title = "#" + r.id + " " + (r.subject || "");
            track.appendChild(issueNode(r, sc));
          }
          row.appendChild(label);
          row.appendChild(track);
          return row;
        }

        function groupTitle(g) {
          var sub = unwrapFirstLine(g.description);
          return sub ? g.title + " \u2014 " + sub : g.title;
        }

        function fitLabels() {
          rootEl.querySelectorAll(".tl-month").forEach(function (c) {
            c.textContent = c.getAttribute("data-long");
            if (c.scrollWidth > c.clientWidth) {
              c.textContent = c.getAttribute("data-short");
            }
          });
          rootEl.querySelectorAll(".bar").forEach(function (b) {
            b.classList.remove("nolabel");
            if (b.scrollWidth > b.clientWidth) b.classList.add("nolabel");
          });
        }

        function render(p) {
          hideDetail();
          nameEl.textContent = p.project.name + " \u00b7 " + p.window.label;
          roPill.hidden = !p.read_only;
          var notes = [];
          if (p.truncated) {
            notes.push("Showing the first 250 issues per query, most recently " +
              "started first. Narrow with filters or dates.");
          }
          if (p.partial) notes.push("Some data could not be loaded.");
          truncatedEl.textContent = notes.join(" ");
          truncatedEl.hidden = notes.length === 0;
          footLeft.textContent = "Read-only: click a bar or milestone for details." +
            (p.unscheduled ? " \u00b7 " + p.unscheduled + " unscheduled" : "");

          if (!p.groups || p.groups.length === 0) {
            rootEl.replaceChildren(el("div", "panel",
              "No scheduled issues in this window" +
              (p.unscheduled ? " (" + p.unscheduled + " unscheduled)." : ".")));
            queueResize();
            return;
          }
          var sc = makeScale(p.window);
          var tl = el("div", "tl");
          var overlay = el("div", "tl-overlay");
          tl.appendChild(axis(p.window, sc, overlay));
          var body = el("div", "tl-body");
          p.groups.forEach(function (g) {
            body.appendChild(el("div", "tl-group", groupTitle(g)));
            g.rows.forEach(function (r, i) {
              body.appendChild(rowEl(r, sc, i));
            });
          });
          tl.appendChild(body);
          todayLine(p.window, sc, overlay);
          tl.appendChild(overlay);
          rootEl.replaceChildren(tl);
          requestAnimationFrame(fitLabels);
          queueResize();
        }

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && !detailEl.hidden) hideDetail();
        });
        window.addEventListener("resize", function () {
          requestAnimationFrame(fitLabels);
        });
        function extractError(result) {
          try {
            return result.content[0].text;
          } catch (e) {
            return "The timeline could not load.";
          }
        }
        function renderError(message) {
          rootEl.replaceChildren(
            el("div", "panel error", message || "Something went wrong.")
          );
          refreshBtn.disabled =
            state.projectId === null || state.projectId === undefined;
          queueResize();
        }
        function applyResult(result) {
          if (!result) return;
          if (result.isError) {
            renderError(extractError(result));
            return;
          }
          var data = result.structuredContent;
          if (data && data.error) {
            renderError(String(data.error));
            return;
          }
          if (data) {
            state.payload = data;
            if (data.project && data.project.id != null) {
              state.projectId = data.project.id;
            }
            render(data);
          }
        }

        function setBusy(on) {
          refreshBtn.disabled = on;
          refreshBtn.textContent = on ? "Refreshing..." : "Refresh";
        }
        async function fetchData(isRefresh) {
          if (state.projectId === null || state.projectId === undefined) return;
          if (isRefresh) setBusy(true);
          try {
            var result = await request("tools/call", {
              name: "get_project_timeline_data",
              arguments: {
                project_id: state.projectId,
                start_date: state.startDate,
                end_date: state.endDate,
                filters: state.filters,
              },
            });
            applyResult(result);
          } catch (e) {
            renderError(e.message || "The timeline could not load.");
          } finally {
            if (isRefresh) setBusy(false);
          }
        }
        var initialLoadStarted = false;
        function maybeInitialLoad() {
          if (
            !state.ready ||
            state.payload ||
            initialLoadStarted ||
            state.projectId === null ||
            state.projectId === undefined
          ) {
            return;
          }
          initialLoadStarted = true;
          fetchData(false);
        }

        async function connect() {
          await request("ui/initialize", {
            appInfo: { name: "redmine-project-timeline", version: "1.0.0" },
            appCapabilities: {},
            protocolVersion: PROTOCOL_VERSION,
          });
          notify("ui/notifications/initialized");
          state.ready = true;
          reportSize();
          maybeInitialLoad();
        }

        window.addEventListener("message", onMessage);
        window.addEventListener("resize", queueResize);
        if (window.ResizeObserver) {
          var ro = new ResizeObserver(queueResize);
          ro.observe(document.documentElement);
          ro.observe(document.body);
        }
        refreshBtn.addEventListener("click", function () {
          fetchData(true);
        });
        connect().catch(function () {});
      })();
    </script>
  </body>
</html>
