services:
  redmine-mcp-server:
    labels:
      vilnius.logging.enabled: "true"
      vilnius.logging.app: redmine-mcp-server
      vilnius.logging.component: mcp
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redmine-mcp-server
    init: true
    ports:
      - "${SERVER_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      ATTACHMENTS_DIR: /app/attachments
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./attachments:/app/attachments
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    networks:
      - redmine-mcp-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

networks:
  redmine-mcp-network:
    driver: bridge

volumes:
  redmine-mcp-logs:
  redmine-mcp-data:
