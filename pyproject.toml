[project]
name = "redmine-mcp-server"
version = "2.20.0"
description = "MCP server that lets AI assistants manage Redmine issues, projects, wikis, and time tracking"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["redmine", "mcp", "model-context-protocol", "project-management", "server"]
authors = [
    {name = "Kevin Tan", email = "6021013+jztan@users.noreply.github.com"}
]
maintainers = [
    {name = "Kevin Tan", email = "6021013+jztan@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Groupware",
]
dependencies = [
    "python-dotenv>=1.0.0,<2",
    "httpx>=0.27.0,<1",
    "fastmcp>=4.1.2,<5",
    "python-redmine>=2.5.0,<3",
    "requests>=2.31.0,<3",
    "starlette>=1.3.1,<2",
    "uvicorn>=0.24.0,<1",
    "python-multipart>=0.0.30,<1",
    "urllib3>=2.7.0,<3",
    "pyjwt[crypto]>=2.15.0,<3",
    "cryptography>=48.0.1,<51",
    "joserfc>=1.7.6,<2",
]

[project.urls]
Homepage = "https://github.com/jztan/redmine-mcp-server"
Repository = "https://github.com/jztan/redmine-mcp-server.git"
Issues = "https://github.com/jztan/redmine-mcp-server/issues"
Changelog = "https://github.com/jztan/redmine-mcp-server/blob/develop/CHANGELOG.md"

[project.scripts]
redmine-mcp-server = "redmine_mcp_server.main:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0,<10",
    "pytest-asyncio>=0.21.0,<2",
    "pytest-cov>=4.0.0,<8",
    "pytest-mock>=3.10.0,<4",
    "httpx>=0.28.1,<1",
]
dev = [
    "pytest>=7.0.0,<10",
    "pytest-asyncio>=0.21.0,<2",
    "pytest-cov>=4.0.0,<8",
    "pytest-mock>=3.10.0,<4",
    "httpx>=0.28.1,<1",
    "flake8>=6.0.0,<8",
    "black>=23.0.0,<27",
    "pre-commit>=3.0.0,<5",
]

[tool.uv]
# Security floors for transitive dependencies (not imported directly). Drop each
# entry once an upstream dependency raises its own floor past these versions.
#   click < 8.3.3  -> PYSEC-2026-2132 (via uvicorn / rich-click stack)
#   mcp   < 2.2.0  -> CVE-2026-59951 (via fastmcp-slim)
#   authlib < 1.9.1  -> CVE-2026-96760, CVE-2026-116672 and PYSEC-2026-4354..4360
#                       (via fastmcp-slim)
#   certifi < 2026.10.18  -> PYSEC-2026-4320 (via httpx / requests)
#   opentelemetry-api < 1.45.1  -> CVE-2026-114603 (via mcp / fastmcp-slim)
#   dnspython < 2.9.0  -> CVE-2026-114605 (via email-validator)
constraint-dependencies = [
    "authlib>=1.9.1",
    "certifi>=2026.10.18",
    "click>=8.3.3",
    "dnspython>=2.9.0",
    "mcp>=2.2.0",
    "opentelemetry-api>=1.45.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redmine_mcp_server"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]